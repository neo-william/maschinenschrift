slug: la-scuola-dei-silenzi
title: La Scuola dei Silenzi
author: I.O. Vargas
year: 2026
language: en
genre: Roman
zeichen:
  wortlaut: 5
  geist: 3
  beleg: ausstehend
narration:
  en: >
    The originating idea is mine. So are individual characters, places and
    motifs: free positings that stood before any proposal. Mine too are the
    rules the language was to follow — set by me, executed by the substrate.
    The substrate supplied, in quantity: material, variants, proposals for
    characters, architecture and canon; which move stands, I decided. The same
    division across all iterations. The linguistic surface is predominantly
    substrate-mediated. Research material was structured through the substrate,
    not verified.
  de: >
    Der Ausgangsgedanke ist meiner. Einzelne Figuren, Orte und Motive ebenso:
    freie Setzungen, die vor jedem Vorschlag standen. Meine sind auch die
    Regeln, nach denen die Sprache laufen sollte — gesetzt von mir, ausgeführt
    vom Substrat. Das Substrat legte vor, in großer Zahl: Material, Varianten,
    Vorschläge zu Figuren, Aufbau und Kanon; welcher Zug gilt, entschied ich.
    Dieselbe Teilung über alle Iterationen. Die sprachliche Oberfläche ist
    überwiegend substratvermittelt. Recherchematerial wurde über das Substrat
    strukturiert, nicht verifiziert.
