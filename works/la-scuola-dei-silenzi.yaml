# Werte auf W=5 / G=3 nachgezogen am 2026-08-02: das ausgelieferte Cover
# cover_v11.png trägt seit 2026-07-31 das Siegel 5/3/ausstehend im Bild, und
# der Druck ist die verbindliche Deklaration (ADR 0035). Die Anhebung 4→5 / 2→3
# spiegelt die Phasen 7–11, in denen die sprachliche Oberfläche durchgehend
# substratvermittelt überarbeitet wurde.
# Achsen-Historie: Erstdeklaration 2026-06-01 als D=4 / G=2, identisch mit der
# pre-2026-05-24-Fassung F=4 / S=2 — bis dahin waren nur die Achsen umbenannt
# (ADR 0032). Die Anhebung auf 5/3 ist die erste inhaltliche Neubewertung.
# Narration am 2026-08-02 neu gefasst (ADR 0044): Setzungen und Stilgesetzgebung
# stehen jetzt im Text, weil G=3 sonst nicht lesbar ist.
# Am 2026-08-03 gestrichen (ADR 0050): der Anspruchsverzicht „ich beanspruche
# sie nicht als eigenen Wortlaut" / „I do not claim it as my own wording".
# W=5 bleibt davon unberührt — die Achse misst, wie viel der sprachlichen
# Oberfläche vom Modell kam, und 5 ist ihr Maximum; der beschreibende Satz
# „die sprachliche Oberfläche ist überwiegend substratvermittelt" steht weiter.
# Die Deklaration sagt damit unverändert, was der Fall ist, und verzichtet
# nicht mehr zusätzlich auf einen Anspruch.
# Katalognummer MS-0001 vergeben am 2026-08-12 (ADR 0088): Format MS-NNNN,
# fortlaufend bei Aufnahme in den Katalog, nie neu vergeben.
# Am 2026-08-17 um den Titelbild-Satz ergänzt (ADR 0139): die drei Achsen messen
# Text, für das Bild gibt es keine, und eine vierte ist ausgeschlossen (ADR 0031).
# Der Eintrag erklärte bis dahin die Prosa und schwieg über den Umschlag —
# gegen „disclosed, not discovered" die eine offene Stelle. Werte unverändert
# 5 / 3 / ausstehend; der Satz deklariert, er bewertet nicht neu.
#
# 2026-08-24, Spec v8 (ADR 0160): die B-Achse hält nicht mehr die bibliografische
# Auffindbarkeit fest, sondern ob die Faktenaussagen des Werks gegen Quellen
# außerhalb des Substrats geprüft wurden. **Der Wert bleibt `ausstehend`, aber
# aus einem anderen Grund.** Bis zum 23.08. stand er dort, weil es keine Listung
# gab; seit dem 24.08. steht er dort, weil die Recherche nie gegengeprüft wurde —
# die Narration sagt es seit dem 2026-08-02 wörtlich: „Recherchematerial wurde
# über das Substrat strukturiert, nicht verifiziert." Die Zahlenwerte W und G
# sind unberührt. Die Auffindbarkeit ist damit nicht entfallen, sondern
